<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My page</title>
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My page">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/me.css">
</head>
<body>
  <header class="top">
    <div>
      <h1 id="page-title">Home</h1>
      <div class="sub" id="page-sub"><a href="/">⚙️ Planner</a> · <a href="/meals">🍽️ Meals</a> · <a href="/house">🏠 House</a> · <a href="/admin">🛠️ Admin</a></div>
    </div>
    <button class="icon-btn" id="bell-btn" aria-label="Notifications" style="margin-left:auto;margin-right:8px">
      <svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0"/></svg>
    </button>
    <button class="icon-btn" id="refresh-btn" aria-label="Refresh">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
    </button>
  </header>

  <main>
    <section id="view-home" class="view"></section>
    <section id="view-calendar" class="view" hidden></section>
    <section id="view-kids" class="view" hidden></section>
    <section id="view-meds" class="view" hidden></section>
    <section id="view-lab" class="view" hidden>
      <div class="seg page-tabs lab-tabs">
        <button type="button" data-lab="pve" class="on">Proxmox</button>
        <button type="button" data-lab="dns">AdGuard</button>
        <button type="button" data-lab="speed">Speed</button>
        <button type="button" data-lab="net">Network</button>
      </div>
      <div id="lab-body"></div>
    </section>
  </main>

  <nav class="tabs colored">
    <button data-view="home" class="active">
      <svg viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg>
      <span>Home</span>
    </button>
    <button data-view="calendar">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Calendar</span>
    </button>
    <button data-view="kids">
      <svg viewBox="0 0 24 24"><circle cx="8.5" cy="8" r="3"/><circle cx="16.5" cy="9.5" r="2.5"/><path d="M3 20c0-3.3 2.5-5.5 5.5-5.5S14 16.7 14 20M13.5 15.3c1-.6 1.9-.8 3-.8 2.5 0 4.5 1.8 4.5 4.5"/></svg>
      <span>Kids</span>
    </button>
    <button data-view="meds">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="8.5" width="17" height="7" rx="3.5" transform="rotate(-35 12 12)"/><path d="M9.6 8.6l4.8 6.8"/></svg>
      <span>Meds</span>
    </button>
    <button data-go="/meals">
      <svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M16 3c-1.7 0-3 2-3 5s1.3 4 3 4v9"/></svg>
      <span>Meals</span>
    </button>
    <button data-go="/house">
      <svg viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M14.5 13.5a2.5 2.5 0 0 0-3.3 3.3L9 19h2l1.6-1.6a2.5 2.5 0 0 0 3.3-3.3l-1.3 1.3-1.2-.2-.2-1.2z"/></svg>
      <span>House</span>
    </button>
    <button data-view="lab">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="6.5" rx="1.5"/><rect x="3.5" y="13.5" width="17" height="6.5" rx="1.5"/><path d="M7 7.25h.01M7 16.75h.01M11 7.25h5M11 16.75h5"/></svg>
      <span>Homelab</span>
    </button>
    <button data-go="/admin">
      <svg viewBox="0 0 24 24"><path d="M14.5 5.5a4 4 0 0 0-5.3 5.3L4 16v4h4l5.2-5.2a4 4 0 0 0 5.3-5.3l-2.6 2.6-2.5-.5-.5-2.5z"/></svg>
      <span>Admin</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div id="sheet-body"></div>
  </div>
  <div class="tip" id="tip" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="/common.js"></script>
  <script src="/me.js"></script>
</body>
</html>
