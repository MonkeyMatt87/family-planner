<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My page</title>
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My page">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/me.css">
</head>
<body>
  <header class="top">
    <div>
      <h1 id="page-title">Home</h1>
      <div class="sub" id="page-sub"><a href="/">⚙️ Full planner</a></div>
    </div>
    <button class="icon-btn" id="refresh-btn" aria-label="Refresh">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
    </button>
  </header>

  <main>
    <section id="view-home" class="view"></section>
    <section id="view-calendar" class="view" hidden></section>
    <section id="view-kids" class="view" hidden></section>
    <section id="view-lab" class="view" hidden>
      <div class="seg page-tabs lab-tabs">
        <button type="button" data-lab="pve" class="on">Proxmox</button>
        <button type="button" data-lab="dns">AdGuard</button>
        <button type="button" data-lab="speed">Speed</button>
        <button type="button" data-lab="net">Network</button>
      </div>
      <div id="lab-body"></div>
    </section>
  </main>

  <nav class="tabs">
    <button data-view="home" class="active">
      <svg viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg>
      <span>Home</span>
    </button>
    <button data-view="calendar">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Calendar</span>
    </button>
    <button data-view="kids">
      <svg viewBox="0 0 24 24"><circle cx="8.5" cy="8" r="3"/><circle cx="16.5" cy="9.5" r="2.5"/><path d="M3 20c0-3.3 2.5-5.5 5.5-5.5S14 16.7 14 20M13.5 15.3c1-.6 1.9-.8 3-.8 2.5 0 4.5 1.8 4.5 4.5"/></svg>
      <span>Kids</span>
    </button>
    <button data-view="lab">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="6.5" rx="1.5"/><rect x="3.5" y="13.5" width="17" height="6.5" rx="1.5"/><path d="M7 7.25h.01M7 16.75h.01M11 7.25h5M11 16.75h5"/></svg>
      <span>Homelab</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div id="sheet-body"></div>
  </div>
  <div class="tip" id="tip" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="/common.js"></script>
  <script src="/me.js"></script>
</body>
</html>
