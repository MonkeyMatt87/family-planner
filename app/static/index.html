<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Planner</title>
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1 id="page-title">Home</h1>
      <div class="sub" id="page-sub"></div>
    </div>
    <button class="icon-btn" id="refresh-btn" aria-label="Refresh">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
    </button>
  </header>

  <main>
    <!-- HOME -->
    <section id="view-home" class="view"></section>

    <!-- TASKS -->
    <section id="view-tasks" class="view" hidden>
      <div class="chips" id="task-filter"></div>
      <div id="task-list"></div>
    </section>

    <!-- LUNCH -->
    <section id="view-lunch" class="view" hidden>
      <div class="row-actions">
        <button class="btn secondary" id="lunch-defaults-btn">Weekly defaults</button>
        <button class="btn secondary" id="lunch-import-btn">Paste menu</button>
      </div>
      <div id="lunch-list"></div>
    </section>

    <!-- WORK -->
    <section id="view-work" class="view" hidden>
      <div class="chips" id="work-person"></div>
      <div class="row-actions">
        <button class="btn secondary" id="type-shifts-btn">⌨️ Type shifts</button>
      </div>
      <p class="hint"><b>📅 Open day</b>: tap a day to see, add or change its shifts. Or pick a shift below and tap each day it happens (tap again to take it off).</p>
      <div class="chips" id="work-templates"></div>
      <div class="month-nav">
        <button class="icon-btn" id="month-prev" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <h2 id="month-label"></h2>
        <button class="icon-btn" id="month-next" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <div class="month" id="month-grid"></div>
      <h3 class="section-h" id="shifts-heading">Shifts</h3>
      <div id="shift-list"></div>
    </section>

    <!-- BILLS (adults only: never on the kids' pages, and off the wall unless turned on) -->
    <section id="view-bills" class="view" hidden>
      <div class="row-actions">
        <button class="btn" id="add-bill-btn">+ Add bill</button>
      </div>
      <div id="bill-list"></div>
    </section>

    <!-- SETTINGS -->
    <section id="view-settings" class="view" hidden></section>
  </main>

  <button class="fab" id="fab" aria-label="Add task">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabs">
    <button data-view="home" class="active">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Home</span>
    </button>
    <button data-view="tasks">
      <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17"/></svg>
      <span>Tasks</span>
    </button>
    <button data-view="lunch">
      <svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0zM9 4c0 2 2 2 2 4M14 4c0 2 2 2 2 4"/></svg>
      <span>Lunch</span>
    </button>
    <button data-view="work">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="7" width="17" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3.5 13h17"/></svg>
      <span>Work</span>
    </button>
    <button data-view="bills">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6.5 9.5v5M17.5 9.5v5"/></svg>
      <span>Bills</span>
    </button>
    <button data-view="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <!-- bottom sheet used for every form -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div id="sheet-body"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/common.js"></script>
  <script src="/passkey.js"></script>
  <script src="/app.js"></script>
</body>
</html>
