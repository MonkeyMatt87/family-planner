<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meals</title>
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Meals">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/meals.css">
</head>
<body>
  <header class="top">
    <div>
      <h1 id="page-title">Suppers</h1>
      <div class="sub" id="page-sub"><a href="/" id="back-link">← Planner</a></div>
    </div>
    <button class="icon-btn" id="refresh-btn" aria-label="Refresh">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
    </button>
  </header>

  <main>
    <section id="view-plan" class="view"></section>
    <section id="view-list" class="view" hidden></section>
    <section id="view-pantry" class="view" hidden></section>
    <section id="view-recipes" class="view" hidden></section>
    <section id="view-deals" class="view" hidden></section>
  </main>

  <nav class="tabs">
    <button data-view="plan" class="active">
      <svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M16 3c-1.7 0-3 2-3 5s1.3 4 3 4v9"/></svg>
      <span>Suppers</span>
    </button>
    <button data-view="list">
      <svg viewBox="0 0 24 24"><path d="M3.5 5h2l2.2 10.5h10.8L21 8H7"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
      <span>List</span>
    </button>
    <button data-view="pantry">
      <svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M5 10h14M9 7v0M9 13.5v3"/></svg>
      <span>In the house</span>
    </button>
    <button data-view="recipes">
      <svg viewBox="0 0 24 24"><path d="M5 4.5h11a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8.5h6"/></svg>
      <span>Recipes</span>
    </button>
    <button data-view="deals">
      <svg viewBox="0 0 24 24"><path d="M3.5 12.5 12 4h8v8l-8.5 8.5z"/><circle cx="16" cy="8" r="1.4"/></svg>
      <span>Deals</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div id="sheet-body"></div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="/common.js"></script>
  <script src="/meals.js"></script>
</body>
</html>
