# Push a tag like v1.0.1 to publish a release with the files the installers download.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the release files
        run: bash scripts/make-release.sh "${GITHUB_REF_NAME}"
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/family-planner-${{ github.ref_name }}.tar.gz
            dist/family-planner.tar.gz
            dist/install-proxmox.sh
            dist/install.sh
            dist/SHA256SUMS
          body_path: CHANGELOG.md

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Planner image (amd64 + arm64, for a Raspberry Pi 4/5 too)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/family-planner:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/family-planner:latest
